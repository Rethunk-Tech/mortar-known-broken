name: publish

on:
  push:
    branches: [main]
    paths: ["lists/*.json"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sign and upload changed lists
        env:
          UPDATE_KEY: ${{ secrets.MORTAR_UPDATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          test -n "$UPDATE_KEY"
          umask 077
          key="$RUNNER_TEMP/updater.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_KEY" >"$key"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            changed=$(ls lists/*.json)
          else
            changed=$(git diff --name-only "$BEFORE" HEAD -- 'lists/*.json')
          fi
          gh release view lists >/dev/null 2>&1 || gh release create lists --title "Known-broken lists" --notes "Signed per-game lists Mortar downloads." --latest=false
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          for f in $changed; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            scripts/check-schema.sh "$f"
            jq -c --argjson serial "$(date +%s)" '. + {serial: $serial}' "$f" >"$out/$name"
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$out/$name" -out "$out/$name.sig"
            # .sig stays the raw-payload signature released Mortars verify; .v2.sig binds the payload to this list.
            { printf 'mortar-known-broken-v1\n'; cat "$out/$name"; } >"$out/$name.v2"
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$out/$name.v2" -out "$out/$name.v2.sig"
            gh release upload lists "$out/$name" "$out/$name.sig" "$out/$name.v2.sig" --clobber
          done
